# Armbian build config: A10 kernel (tested on a Rikomagic MK802) with the patches of
# ../../kernel/sunxi-6.18/.
#   copy to <armbian-build>/userpatches/ (see ../README.md), then ./compile.sh cubie-a10 kernel
# Armbian builds one kernel package for all 32-bit sunxi boards; BOARD only selects the family here.
declare -g BOARD=cubieboard
declare -g BRANCH=current
declare -g KERNEL_CONFIGURE=no
declare -g KERNEL_GIT=shallow

# The patches were made and tested against 6.18.56; pin the kernel to that tag.
function post_family_config__cubie_pin_kernel_6_18_56() {
	declare -g KERNELBRANCH="tag:v6.18.56"
}

# Single Cortex-A8: A8 code generation (patch 0003), no SMP (one core, no SMP barriers or lock
# code) and a 2G/2G split, so the whole 1 GiB is lowmem. This kernel does not suit SMP boards.
# No schedutil governor: CPU_FREQ_GOV_SCHEDUTIL depends on SMP.
function custom_kernel_config__cubie_a10_cortex_a8() {
	kernel_config_modifying_hashes+=("ARMV7_TUNE_CORTEX_A8=y" "SMP=n" "VMSPLIT_2G=y")
	opts_y+=("ARMV7_TUNE_CORTEX_A8" "VMSPLIT_2G")
	opts_n+=("ARMV7_TUNE_GENERIC" "SMP" "VMSPLIT_3G")
}

# 2D engine (mixer processor) driver sun4i-mp, patches 0018-0021 + 0038.
function custom_kernel_config__cubie_mixer_processor() {
	kernel_config_modifying_hashes+=("DRM_SUN4I_MP=m")
	opts_m+=("DRM_SUN4I_MP")
}

# Thermal: step_wise by default. Armbian's sunxi config selects fair_share, which never throttles
# with the cooling-device weight 0 of the sun4i/sun7i cpu-thermal zones (an A10 reached 92 °C).
function custom_kernel_config__cubie_thermal_step_wise() {
	kernel_config_modifying_hashes+=("THERMAL_DEFAULT_GOV_STEP_WISE=y")
	opts_y+=("THERMAL_DEFAULT_GOV_STEP_WISE")
	opts_n+=("THERMAL_DEFAULT_GOV_FAIR_SHARE")
}
