# Armbian build config: Cubietruck / A20 kernel with the patches of ../../kernel/sunxi-6.18/.
#   copy to <armbian-build>/userpatches/ (see ../README.md), then ./compile.sh cubie-a20 kernel
# Armbian builds one kernel package for all 32-bit sunxi boards (linux-image-current-sunxi), so
# BOARD only selects the family; the tested A20 kernels were built with exactly these settings.
declare -g BOARD=cubieboard2
declare -g BRANCH=current
declare -g KERNEL_CONFIGURE=no
declare -g KERNEL_GIT=shallow

# The patches were made and tested against 6.18.56; pin the kernel to that tag.
function post_family_config__cubie_pin_kernel_6_18_56() {
	declare -g KERNELBRANCH="tag:v6.18.56"
}

# Cubietruck Bluetooth (AP6210 on UART2): the A20 DesignWare UART has no CPR register, so
# without the 16550A variant probe it runs as a plain 16550A (16-byte FIFO, no hardware
# RTS/CTS) and the first HCI commands get lost.
function custom_kernel_config__cubie_uart_afe() {
	kernel_config_modifying_hashes+=("SERIAL_8250_16550A_VARIANTS=y")
	opts_y+=("SERIAL_8250_16550A_VARIANTS")
}

# 2D engine (mixer processor) driver sun4i-mp, patches 0018-0022; Armbian's config does not know
# the new option.
function custom_kernel_config__cubie_mixer_processor() {
	kernel_config_modifying_hashes+=("DRM_SUN4I_MP=m")
	opts_m+=("DRM_SUN4I_MP")
}

# Cortex-A7 code generation (patch 0003, a Kconfig choice): hardware divide and A7 tuning. The
# kernel then runs only on the A20. Leave this function out for a kernel that also boots on A10/A13.
function custom_kernel_config__cubie_cortex_a7() {
	kernel_config_modifying_hashes+=("ARMV7_TUNE_CORTEX_A7=y")
	opts_y+=("ARMV7_TUNE_CORTEX_A7")
	opts_n+=("ARMV7_TUNE_GENERIC")
}

# Thermal: step_wise by default. Armbian's sunxi config selects fair_share, which never throttles
# with the cooling-device weight 0 of the sun4i/sun7i cpu-thermal zones.
function custom_kernel_config__cubie_thermal_step_wise() {
	kernel_config_modifying_hashes+=("THERMAL_DEFAULT_GOV_STEP_WISE=y")
	opts_y+=("THERMAL_DEFAULT_GOV_STEP_WISE")
	opts_n+=("THERMAL_DEFAULT_GOV_FAIR_SHARE")
}
